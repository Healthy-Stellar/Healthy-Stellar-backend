name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose secrets
        run: |
          mkdir -p secrets
          echo "postgres" > secrets/db_password.txt
          echo "smoke-jwt-secret" > secrets/jwt_secret.txt
          echo "smoke-jwt-refresh-secret" > secrets/jwt_refresh_secret.txt
          echo "SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" > secrets/stellar_secret_key.txt
          echo "$(printf 'a%.0s' {1..64})" > secrets/encryption_key.txt
          echo "smoke-metrics-token" > secrets/metrics_token.txt
          echo "smoke-queue-hmac-secret" > secrets/queue_hmac_secret.txt
      - name: Boot stack
        run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed"
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
